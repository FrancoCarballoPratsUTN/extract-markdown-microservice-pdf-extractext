name: pdf-extractext

# Despliegue unificado del sistema de microservicios (Fase 11).
#
# - Un único punto público: Traefik (sólo él publica puertos en el host).
# - Red "edge": Traefik + orquestador (cara pública, router N-S "orchestrator-public").
# - Red "backend" (internal: true): Traefik + orquestador + extract + persistence +
#   auditlog + mongo. Todo el tráfico E-W pasa por Traefik en su entrypoint
#   "web-internal" (:8443, TLS), nunca en claro, nunca por DNS directo.
# - Labels: docker provider declara SOLO enable + server.port. La red la fija
#   el provider (pdf-extractext_backend); routers, middlewares, serversTransport
#   y TLS viven centralizados en traefik/dynamic.yml.
#
# Audit Log ya tiene Dockerfile (equipo AUDA); el compose lo declara por build:
# y queda integrado al stack base. Escucha en :8000.
#
# Orden de arranque: NO se usa depends_on. El orden (mongo -> traefik ->
# extract/persistence/auditlog -> orchestrator) lo garantiza el target
# `make deploy` (ver Makefile), que levanta por fases y espera el health de
# cada una. Si se usa `docker compose up` directo, los servicios arrancan en
# paralelo y dependen de sus healthchecks + restart para converger.
#
# Servicios: traefik, orchestrator, extract, persistence, auditlog, mongo.

networks:
  edge:
    driver: bridge
  backend:
    internal: true

volumes:
  mongo-data:

services:
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      # El nivel de log se puede overridear desde .env (CLI > config estática).
      - --log.level=${LOG_LEVEL:-info}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./certs:/etc/traefik/certs:ro
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Enlaza 80/443 (puertos privilegiados) como root: conserva solo esa cap.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  orchestrator:
    build:
      context: ../validator/ValidationMicroservices-pdf-extractext
      dockerfile: Dockerfile
    image: pdf-extractext-orchestrator:0.1.0
    restart: unless-stopped
    init: true
    environment:
      PORT: ${ORCHESTRATOR_PORT:-8080}
      # E-W: todo el tráfico hacia los MS pasa por el entrypoint interno TLS de
      # Traefik (web-internal :8443). Ningún MS se habla por DNS directo.
      EXTRACT_BASE_URL: ${EXTRACT_BASE_URL:-https://traefik:8443}
      PERSISTENCE_BASE_URL: ${PERSISTENCE_BASE_URL:-https://traefik:8443}
      AUDIT_LOG_BASE_URL: ${AUDIT_LOG_BASE_URL:-https://traefik:8443}
      # Un solo secreto por MS: el MS lo exige como SERVICE_API_TOKEN a la
      # entrada y el orquestador lo reenvía. Sin default: el arranque falla si falta.
      AUDIT_LOG_API_TOKEN: ${AUDIT_LOG_API_TOKEN:?AUDIT_LOG_API_TOKEN is required}
      PERSISTENCE_API_TOKEN: ${PERSISTENCE_API_TOKEN:?PERSISTENCE_API_TOKEN is required}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-35s}
      MAX_PDF_SIZE_BYTES: ${MAX_PDF_SIZE_BYTES:-15MB}
      MAX_TEXT_BODY_BYTES: ${MAX_TEXT_BODY_BYTES:-15MB}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-1000}
      # CA de desarrollo (mkcert) para validar el cert de Traefik en el tramo
      # H2b (orq -> https://traefik:8443). Go lo honra en Linux.
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs:/certs:ro
    stop_grace_period: ${STOP_GRACE_PERIOD:-45s}
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.services.orchestrator.loadbalancer.server.port=8080

  extract:
    build:
      context: ../Conversor/extract-markdown-microservice-pdf-extractext
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    stop_grace_period: ${STOP_GRACE_PERIOD:-45s}
    environment:
      PORT: "8080"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_PAGES: ${MAX_PAGES:-1000}
      MAX_WORKERS: ${MAX_WORKERS:-2}
      QUEUE_SIZE: ${QUEUE_SIZE:-56}
      QUEUE_MAX_MB: ${QUEUE_MAX_MB:-256}
      READ_TIMEOUT: "30"
      WRITE_TIMEOUT: "30"
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-35}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.services.extract.loadbalancer.server.port=8080

  # Dockerfile propio del equipo de Persistence. Escucha en :8000; expone /health.
  persistence:
    build:
      context: ../persistence/PersistenceMicroservices-pdf-extractext
    image: pdf-extractext-persistence:latest
    restart: unless-stopped
    environment:
      SERVICE_API_TOKEN: ${PERSISTENCE_API_TOKEN:?PERSISTENCE_API_TOKEN is required}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: pdf_extractext
      MONGO_TEXTS_COLLECTION: texts
      MONGO_TIMEOUT_MS: "5000"
      MAX_TEXT_BODY_BYTES: "10485760"
      APP_NAME: Persistence Microservice
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    labels:
      - traefik.enable=true
      - traefik.http.services.persistence.loadbalancer.server.port=8000

  # Dockerfile propio del equipo de AUDA. Escucha en :8000 (el Dockerfile trae
  # EXPOSE 8000, CMD uvicorn ... --port 8000 y su propio HEALTHCHECK /health).
  # No se sobreescribe `command`: se usa el del Dockerfile. Hardening espejo del
  # resto (cap_drop ALL, read_only + tmpfs, no-new-privileges).
  auditlog:
    build:
      context: ../audit_log/audit-log-microservice-pdf-extractext
    image: pdf-extractext-auditlog:latest
    restart: unless-stopped
    environment:
      SERVICE_API_TOKEN: ${AUDIT_LOG_API_TOKEN:?AUDIT_LOG_API_TOKEN is required}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: pdf_extractext_audit
      MONGO_AUDIT_LOGS_COLLECTION: audit_logs
      MONGO_TIMEOUT_MS: "5000"
      MAX_BODY_BYTES: "1048576"
      MAX_DETAILS_BYTES: "65536"
      DEFAULT_LIMIT: "10"
      MAX_LIMIT: "100"
      MAX_SKIP: "10000"
      RETENTION_DAYS: "0"
      APP_NAME: Audit Log Microservice
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    labels:
      - traefik.enable=true
      - traefik.http.services.auditlog.loadbalancer.server.port=8000

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    # El entrypoint oficial necesita chown del volumen y bajar a usuario
    # mongodb (setuid/setgid): se conservan solo esas capacidades.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5