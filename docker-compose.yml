services:
  traefik:
    image: traefik:v3.6.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=edge
      - --entrypoints.web.address=:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # El runtime distroless ya es no-root y no escribe en disco; se declara el
    # contrato mínimo en el despliegue además de en la imagen. No se añade
    # almacenamiento efímero adicional salvo que el smoke lo exija.
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    env_file:
      - path: .env
        required: false
    environment:
      # La ruta del .env es del host y no existe dentro del contenedor; la
      # imagen fija la suya. environment tiene precedencia sobre env_file.
      - PDF_OXIDE_LIB_PATH=/opt/pdf_oxide/libpdf_oxide.so
    # Por encima del SHUTDOWN_TIMEOUT: primero el servicio drena los trabajos
    # en vuelo y sólo después Docker lo mata.
    stop_grace_period: ${STOP_GRACE_PERIOD:-45s}
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.extract.rule=HostRegexp(`extract\.universidad\.localhost|localhost|127\.0\.0\.1`)'
      - "traefik.http.routers.extract.entrypoints=web"
      - "traefik.http.services.extract.loadbalancer.server.port=${PORT:-8080}"
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    driver: bridge